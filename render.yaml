services:
  - type: web
    name: comsierge-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: postgresql://comsierge_user:0bzGlid9MyN4dK4eF4igKciTMkVKpsRb@dpg-d1qmcsodl3ps73933470-a/comsierge
      - key: JWT_SECRET
        value: RANDOMSECRETKEY
      - key: PORT
        value: 3000
      - key: TWILIO_SMS_WEBHOOK_URL
        value: https://comsierge-frontend.onrender.com
        
  - type: web
    name: comsierge-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start  # or "next start" depending on your scripts
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://comsierge-backend.onrender.com
  

- type: cron
    name: message-scheduler
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node cron/sendScheduledMessages.js
    schedule: "*/60 * * * *"  # Every 60 minutes
    envVars:
      - key: DATABASE_URL
        value: postgresql://comsierge_user:0bzGlid9MyN4dK4eF4igKciTMkVKpsRb@dpg-d1qmcsodl3ps73933470-a/comsierge
      - key: JWT_SECRET
        value: RANDOMSECRETKEY

  
